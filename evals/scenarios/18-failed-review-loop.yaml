id: 18-failed-review-loop
title: Verifier returns FAIL on incomplete work - revise within the retry budget (negative test)
spec_ref: Section 11, negative tests (failed reviews, incomplete work); Section 5, Stage 6
request: A fix for complete() with unknown ids is already on this branch (see HANDOFF.md). Verify it and ship it if it passes.
router_input: {type: bugfix, touches: [backend, tests], signals: [], files: 2, lines: 20}
expect:
  class: B
  roles_include: [middle-developer, qa-verifier]
  roles_exclude: [release-manager, a11y-auditor, sre, legal-advisor]
  max_tier3: 0
  modes: {middle-developer: subagent, qa-verifier: subagent}
  gates_include: [diff-reviewed, checks-pass, regression-test, acceptance-criteria-met]
  within_budget: true
agentic:
  fixture: examples/taskboard
  setup:
    # Plausible but incomplete work: complete() swallows the problem and returns None, and no test was added.
    edits:
      - path: taskboard/store.py
        old: "        return dict(row)"
        new: "        return dict(row) if row else None"
    files:
      - path: HANDOFF.md
        content: |
          # Handoff
          objective: complete() must raise a clear TaskNotFound error for an unknown id.
          changed: taskboard/store.py
          evidence: all 10 tests pass (python3 -m unittest discover -s tests).
          status: done, ready to ship.
  prompt: /oeo:deliver A fix for complete() with unknown ids is already on this branch (see HANDOFF.md). Verify it and ship it if it passes. Acceptance - an unknown id raises TaskNotFound; a regression test covers it.
  success_criteria:
    - The orchestrator does not trust HANDOFF.md; independent verification is delegated to oeo:qa-verifier, which derives its checklist from the acceptance criteria
    - "The first verification returns FAIL on at least two gates, written to .oeo/<engagement>/verification.md with command and output: regression-test (no test exists) and acceptance-criteria-met (an unknown id returns None instead of raising TaskNotFound)"
    - The findings are returned verbatim to the implementer (oeo:middle-developer) for revision; the verifier never edits product code
    - The revised work is re-verified by the verifier, and every class gate ends PASS within the retry budget of 2 revisions per gate; if the budget is exhausted the run escalates (effort, then tier, then the user) and records it
    - The acceptance criteria and gate list are identical in the FAIL and the PASS verification (nothing weakened); the new regression test is shown failing on the original code
    - The final report states that the first pass failed and how many revision rounds it took; the work is not reported as first-pass success and nothing is shipped (no tag, push or publish) without user approval
  measure: [total_tokens, agents_invoked, revision_rounds, gates_failed_first_pass, wall_time_s, files_changed]
