name: Feature request
description: Suggest an improvement to OEO
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        OEO favors proportionality: new behavior must earn its place. Describe the problem first;
        a solution without a problem is hard to evaluate.
        To propose a **new role**, use the "Role proposal" template instead.
        **Security problems must not be reported here.** See SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, what happens today, and why is that a problem? Include a concrete example task.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Be specific about behavior, files, commands or contracts affected.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including doing nothing or using an existing role, skill or third-party adapter, and why they fall short.
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Roles and stages affected
      description: |
        Which roles, workflow stages, skills, routing rules or scripts would change?
        Example: Stage 0 triage, `qa-verifier`, `/oeo:verify`, `org/routing.yaml`.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I understand that routing, role schema, governance or license changes follow the longer review window in GOVERNANCE.md.
          required: false
