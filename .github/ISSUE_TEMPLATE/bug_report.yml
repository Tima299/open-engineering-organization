name: Bug report
description: Something in OEO does not work as documented
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        **Security problems must not be reported here.** Use the repository's Security tab
        ("Report a vulnerability"); see SECURITY.md.
  - type: input
    id: oeo-version
    attributes:
      label: OEO version
      description: '`version` in `.claude-plugin/plugin.json`, or the tag/commit you installed from.'
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11 (WSL2), ..."
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Only if the bug involves `scripts/` (output of `python3 --version`).
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers the bug, starting from a clean install if possible.
      placeholder: |
        1. /plugin install oeo@open-engineering-organization
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: route-output
    attributes:
      label: "`oeo route` output (if relevant)"
      description: |
        For routing or role-activation bugs, paste the output of
        `python3 scripts/oeo.py route --type <type> --touches <domains> --signals <signals>`.
      render: shell
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs and error output
      description: |
        **Remove secrets, tokens, private code and personal data before pasting.**
        Local OEO logs in `.oeo/` hold summaries only, but check them anyway.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed secrets and private data from everything above.
          required: true
