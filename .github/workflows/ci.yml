name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dev dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Validate contracts, policy, registry, SBOM and docs links
        run: python scripts/oeo.py validate
      - name: Generated files are up to date
        run: python scripts/oeo.py build --check
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Deterministic evaluation suite
        run: python evals/run.py --no-write
      - name: Example fixture tests
        working-directory: examples/taskboard
        run: python -m unittest discover -s tests
      - name: Plugin manifests are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json sbom.cdx.json; do
            python -m json.tool "$f" > /dev/null
          done
