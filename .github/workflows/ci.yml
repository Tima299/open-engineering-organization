name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dev dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Validate contracts, policy, registry, SBOM and docs links
        run: python scripts/oeo.py validate
      - name: Generated files are up to date
        run: python scripts/oeo.py build --check
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Deterministic evaluation suite
        run: python evals/run.py --no-write
      - name: Example fixture tests
        working-directory: examples/taskboard
        run: python -m unittest discover -s tests
      - name: Plugin manifests are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json sbom.cdx.json; do
            python -m json.tool "$f" > /dev/null
          done
