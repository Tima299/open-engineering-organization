# OEO model & effort routing policy (docs/model-routing.md).
# Role contracts only name a tier (light | standard | advanced). This file maps tiers
# to concrete models per profile, so a new model release or another provider is a
# config change, not a rewrite. Select a profile with OEO_MODEL_PROFILE.
#
# This is routing POLICY. The host decides what actually runs: see
# docs/model-routing.md for how Claude Code resolves models and how to verify it.

version: 1
default_profile: default

profiles:
  default:                       # initial profile: Sonnet for bounded roles, Opus for senior/lead/architect/security
    provider: anthropic
    tiers:
      light:    {model_id: claude-haiku-5-5,  host_alias: haiku}
      standard: {model_id: claude-sonnet-5-5, host_alias: sonnet}
      advanced: {model_id: claude-opus-5-5,   host_alias: opus}
  economy:                       # cheaper: no top-tier model unless a role escalates to a human
    provider: anthropic
    tiers:
      light:    {model_id: claude-haiku-5-5,  host_alias: haiku}
      standard: {model_id: claude-haiku-5-5,  host_alias: haiku}
      advanced: {model_id: claude-sonnet-5-5, host_alias: sonnet}

# Per-role overrides applied on top of the role contract, per profile or for all.
overrides:
  all: {}
  # default:
  #   security-engineer: {preferred_model: advanced, effort: high}

# FinOps budgets (oeo:finops guardrails). Tokens = input + output + cache writes; cache reads are
# excluded (cheap, and they dominate raw counts). Per-invocation estimates are keyed by effort.
# Calibrated 2026-10-30 from real installed-plugin runs (evals/results/agentic: 6 subagent runs,
# 8k-21k tokens each) with about 1.5-2x headroom. Recalibrate as more runs land.
budgets:
  per_invocation_tokens: {low: 15000, medium: 30000, high: 60000}
  per_class_tokens: {A: 60000, B: 150000, C: 400000, D: 150000}
