# Third-party provenance registry (ADR 0006, ADR 0008). Machine-readable source
# of THIRD_PARTY.md (generated). OEO vendors NONE of these: every entry is an optional
# adapter the user installs through the upstream's own installer. `oeo validate` applies
# the legal gate (org/routing.yaml `licenses`) to anything not reference-only.
#
# Verification method (2026-10-30): LICENSE files read from raw.githubusercontent.com.
# Commit SHAs could not be read (GitHub API blocked from the research environment), so
# `revision` is UNVERIFIED unless a pin was confirmed from a second source. Re-verify
# before relying on a pin: see CONTRIBUTING.md "Updating the provenance registry".
#
# `adopted_ideas` (optional): ideas OEO re-expressed in its own words, as "oeo:<skill>: <idea>"
# (or "agent output style: <idea>"), at most 15 words each and no semicolons. Rendered into
# THIRD_PARTY.md. No upstream text, brand assets or files are copied.

